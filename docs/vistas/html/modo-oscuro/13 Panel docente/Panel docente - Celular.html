<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel docente · Celular</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#0A0A0A}
a{color:#7BE5B4}a:hover{color:#F5F5F5}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0A0A0A; color: #F5F5F5; font-family: 'Figtree', system-ui, sans-serif">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #2B2B2B"><button aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: transparent; color: #F5F5F5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #7BE5B4; font-weight: 700">Solicitud de aval</span><span style="font-size: 16px; font-weight: 700; color: #F5F5F5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">María López</span></div></header><main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden"><div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px"><div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 999px; background: #1F1F1F; color: #7BE5B4; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">ML</div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; color: #F5F5F5">María López</span><span style="font-size: 14px; color: #A3A3A3">Solicita tu aval para <strong style="color: #F5F5F5">Bases de Datos II · Ciclo 2-2025</strong></span></div></div>

<section style="padding: 16px 18px; background: #151515; border-radius: 10px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #A3A3A3; font-weight: 700">Contribución declarada</span><span style="font-size: 15px; line-height: 1.5; color: #F5F5F5">Modelo de datos y API REST. Confirmado por 2 compañeros de equipo.</span><div style="display: flex; gap: 16px; flex-wrap: wrap"><a href="#" style="font-size: 14px; font-weight: 600">Ver repositorio</a><a href="#" style="font-size: 14px; font-weight: 600">Ver proyecto completo</a></div></section>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 600; color: #F5F5F5">Comentario para el aval (opcional)</span><textarea aria-label="Comentario para el aval (opcional)" placeholder="Qué destacarías del trabajo" style="width: 100%; height: 96px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #2B2B2B; border-radius: 8px; background: #151515; color: #F5F5F5; font-family: inherit; font-size: 15px; line-height: 1.5; resize: none"></textarea><span style="font-size: 13px; color: #A3A3A3">Se muestra junto al aval en el perfil.</span></label>
<div style="display: flex; gap: 10px"><button style="flex: 1 1 0; justify-content: center; height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid #2B2B2B; border-radius: 8px; background: transparent; color: #F5F5F5; font-family: inherit; font-size: 15px; font-weight: 600">Rechazar</button><button style="flex: 1 1 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 8px; background: #3DDC97; color: #0F2A1F; font-family: inherit; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Avalar proyecto</button></div></div></main>
</div>
</body>
</html>
