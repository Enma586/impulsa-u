name: Origen del release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  origen-release:
    name: origen-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La rama de origen debe ser develop de este repositorio
        env:
          ORIGEN: ${{ github.head_ref }}
          REPO_ORIGEN: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$ORIGEN" != "develop" ] || [ "$REPO_ORIGEN" != "$GITHUB_REPOSITORY" ]; then
            echo "A main solo llegan PRs desde develop (origen: $REPO_ORIGEN:$ORIGEN)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: main debe ser ancestro de develop (fast-forward posible)
        run: git merge-base --is-ancestor origin/main origin/develop
